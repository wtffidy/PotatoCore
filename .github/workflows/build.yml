name: Build and Release PotatoCore

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: potatocore-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mod_version="${GITHUB_REF_NAME#v}"
          else
            base_version="$(sed -n "s/^version = project.findProperty('modVersion') ?: '\([^']*\)'/\1/p" build.gradle)"
            base_minor="$(echo "$base_version" | cut -d. -f1,2)"
            mod_version="${base_minor}.${GITHUB_RUN_NUMBER}"
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$mod_version" >> "$GITHUB_OUTPUT"
      - name: Build mod
        run: gradle -PmodVersion=${{ steps.version.outputs.mod_version }} build --no-daemon
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: PotatoCore v${{ steps.version.outputs.mod_version }}
          generate_release_notes: true
          make_latest: true
          files: build/libs/PotatoCore-${{ steps.version.outputs.mod_version }}.jar
